name: Build and test Sample - Cloudflare Durable Objects

on:
  push:
    branches: [main]
    paths:
      - "samples/cloudflare/durable-objects/**"
      - ".github/workflows/build_and_test_sample_cloudflare-durable-objects.yml"
  pull_request:
    paths:
      - "samples/cloudflare/durable-objects/**"
      - ".github/workflows/build_and_test_sample_cloudflare-durable-objects.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: samples/cloudflare/durable-objects

permissions:
  contents: read

jobs:
  build_and_test:
    name: Build and test Cloudflare Durable Objects sample
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: samples/cloudflare/durable-objects/.nvmrc
          cache: npm
          cache-dependency-path: samples/cloudflare/durable-objects/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check Cloudflare types
        run: npm run types:cloudflare:check

      - name: Build TypeScript
        run: npm run build:ts

      - name: Run linting
        run: npm run lint

      - name: Build Worker
        run: npm run build
