name: Build and test Sample - Cloudflare D1

on:
  push:
    branches: [main]
    paths:
      - "samples/cloudflare/d1/**"
      - ".github/workflows/build_and_test_sample_cloudflare-d1.yml"
  pull_request:
    paths:
      - "samples/cloudflare/d1/**"
      - ".github/workflows/build_and_test_sample_cloudflare-d1.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: samples/cloudflare/d1

permissions:
  contents: read

jobs:
  build_and_test:
    name: Build and test Cloudflare D1 sample
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: samples/cloudflare/d1/.nvmrc
          cache: npm
          cache-dependency-path: samples/cloudflare/d1/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check Cloudflare types
        run: npm run types:cloudflare:check

      - name: Build TypeScript
        run: npm run build:ts

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build Worker
        run: npm run build

  deploy:
    name: Deploy Cloudflare D1 sample
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    needs: build_and_test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: samples/cloudflare/d1/.nvmrc
          cache: npm
          cache-dependency-path: samples/cloudflare/d1/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy Worker and migrate schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
